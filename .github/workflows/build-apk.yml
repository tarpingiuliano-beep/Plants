name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de lógica
        run: npm test

      - name: Tests de interfaz
        run: npm run test:ui

      - name: Compilar web
        run: npm run build
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Guardar la web para publicarla en GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Número de versión creciente (para que Android acepte la actualización)
        run: |
          GRADLE=android/app/build.gradle
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "2.${{ github.run_number }}"/' "$GRADLE"
          grep -n "versionCode\|versionName" "$GRADLE"
          grep -q "versionCode ${{ github.run_number }}" "$GRADLE" || { echo "No pude fijar el versionCode"; exit 1; }

      - name: Permisos de Android (notificaciones y ubicación)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$MANIFEST"
          grep -n "uses-permission\|uses-feature" "$MANIFEST"

      - name: Sincronizar Capacitor
        run: |
          npx cap sync android
          grep -q '"CapacitorHttp"' android/app/src/main/assets/capacitor.config.json || { echo "CapacitorHttp no quedó activado"; exit 1; }

      - name: Firmar siempre con la misma clave (así Android acepta las actualizaciones)
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
          tail -14 android/app/build.gradle

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk plantas.apk

      - name: Verificar que el APK lleva la firma esperada
        run: |
          EXPECTED=$(keytool -list -v -keystore signing/debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:" | head -1 | awk '{print $2}')
          ACTUAL=$(keytool -printcert -jarfile plantas.apk | grep "SHA256:" | head -1 | awk '{print $2}')
          echo "Esperada: $EXPECTED"
          echo "Del APK:  $ACTUAL"
          [ -n "$EXPECTED" ] && [ "$EXPECTED" = "$ACTUAL" ] || { echo "La firma del APK no coincide"; exit 1; }

      - name: Compilar APK en línea (abre la app desde GitHub Pages y se actualiza sola)
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.server={url:'https://tarpingiuliano-beep.github.io/Plants/',cleartext:false};fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          npx cap sync android
          grep -q 'github.io/Plants' android/app/src/main/assets/capacitor.config.json || { echo "No quedó la dirección en línea"; exit 1; }
          grep -q '"CapacitorHttp"' android/app/src/main/assets/capacitor.config.json || { echo "CapacitorHttp no quedó activado"; exit 1; }
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../plantas-online.apk

      - name: Verificar la firma del APK en línea
        run: |
          EXPECTED=$(keytool -list -v -keystore signing/debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:" | head -1 | awk '{print $2}')
          ACTUAL=$(keytool -printcert -jarfile plantas-online.apk | grep "SHA256:" | head -1 | awk '{print $2}')
          [ -n "$EXPECTED" ] && [ "$EXPECTED" = "$ACTUAL" ] || { echo "La firma del APK en línea no coincide"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: plantas-apk
          path: |
            plantas.apk
            plantas-online.apk

      - name: Publicar release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Plantas build ${{ github.run_number }}
          body: |
            plantas.apk = versión de siempre (se actualiza instalando un APK nuevo).
            plantas-online.apk = abre la app desde https://tarpingiuliano-beep.github.io/Plants/ y se actualiza sola. Requiere GitHub Pages activado. Al cambiar de una a otra hay que pasar los datos con un respaldo.
          files: |
            plantas.apk
            plantas-online.apk

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
